# Compila o app Astrograph (UI em Rust) e os executáveis auxiliares no Windows, Linux e macOS
# e publica no GitHub Releases, com o SHA256SUMS.txt que os instaladores conferem.
# Nomes: astrograph-<plataforma>[.exe], astrograph-agent-<plataforma>[.exe], astrograph-servicos-<plataforma>[.exe]
# com <plataforma> = windows-x64 | linux-x64 | macos-arm64.
#
# Publicar: crie uma tag `v*` (ex.: git tag v0.1.0 && git push origin v0.1.0)
# ou rode o workflow manualmente informando a tag.
#
# A cada push na `main` o mesmo workflow refaz o release móvel `main-latest` (pré-lançamento) com os
# executáveis desse commit + COMMIT.txt. É de lá que o `:Astrograph atualizar` baixa o app novo quando a
# máquina não tem Rust (conferindo o SHA256); o `releases/latest` dos instaladores não enxerga pré-lançamentos.
name: Release do app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  compilar:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            plataforma: windows-x64
            ext: .exe
          - os: ubuntu-latest
            plataforma: linux-x64
            ext: ""
          - os: macos-14
            plataforma: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            prototype/astrograph-ui
            prototype/astrograph-agent
            prototype/astrograph-servicos
      - name: Testes e compilação
        shell: bash
        run: |
          for crate in astrograph-ui astrograph-agent astrograph-servicos; do
            # na main os testes já rodam no tests.yml: aqui só compila; nas tags roda tudo de novo
            if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              (cd prototype/$crate && cargo test --release && cargo build --release)
            else
              (cd prototype/$crate && cargo build --release)
            fi
          done
      - name: Preparar os executáveis
        shell: bash
        run: |
          mkdir -p saida
          p="${{ matrix.plataforma }}"; e="${{ matrix.ext }}"
          cp "prototype/astrograph-ui/target/release/astrograph-ui$e" "saida/astrograph-$p$e"
          cp "prototype/astrograph-agent/target/release/astrograph-agent$e" "saida/astrograph-agent-$p$e"
          cp "prototype/astrograph-servicos/target/release/astrograph-servicos$e" "saida/astrograph-servicos-$p$e"
      - uses: actions/upload-artifact@v4
        with:
          name: executaveis-${{ matrix.plataforma }}
          path: saida/*
          if-no-files-found: error

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          pattern: executaveis-*
          merge-multiple: true
      - name: SHA256SUMS.txt
        # o install.ps1 e o install.sh conferem cada download contra este arquivo
        run: cd saida && sha256sum astrograph-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release móvel da main
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.sha }}" > saida/COMMIT.txt
          # refaz o release e a tag no commit novo
          gh release delete main-latest --cleanup-tag --yes --repo "${{ github.repository }}" || true
          gh release create main-latest saida/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --prerelease --title "Astrograph main (${GITHUB_SHA::7})" \
            --notes "Executáveis da main no commit ${{ github.sha }}. Usado pelo :Astrograph atualizar; para instalar, use as releases com tag v*."
      - name: Publicar
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Astrograph ${{ github.event.inputs.tag || github.ref_name }}
          files: saida/*
          fail_on_unmatched_files: true
