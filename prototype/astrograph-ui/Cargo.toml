[package]
name = "astrograph-ui"
version = "0.0.1"
edition = "2021"
description = "Spike: UI em Rust do Astrograph sobre Neovim embutido"
publish = false

[dependencies]
winit = "0.30"
softbuffer = "0.4"
nvim-rs = { version = "0.9", features = ["use_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time"] }
async-trait = "0.1"
ab_glyph = "0.2"
ttf-parser = "0.25"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arboard = "3"
