[package]
name = "astrograph-ui"
version = "0.0.1"
edition = "2021"
description = "Astrograph: editor com agentes de IA, UI em Rust sobre o Neovim"
publish = false

[dependencies]
winit = "0.30"
softbuffer = "0.4"
nvim-rs = { version = "0.9", features = ["use_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time"] }
async-trait = "0.1"
ab_glyph = "0.2"
ttf-parser = "0.25"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arboard = "3"
rustybuzz = "0.20.1"

[build-dependencies]
embed-resource = "2.5"

[profile.release]
# executavel menor e um pouco mais rapido (o instalador baixa este arquivo)
strip = true
lto = "thin"
codegen-units = 4
