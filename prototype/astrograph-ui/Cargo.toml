[package]
name = "astrograph-ui"
version = "0.0.1"
edition = "2021"
description = "Astrograph: editor com agentes de IA, UI em Rust sobre o Neovim"
publish = false

[dependencies]
astrograph-syntax = { path = "../astrograph-syntax" }
astrograph-servicos = { path = "../astrograph-servicos" }
astrograph-core = { path = "../astrograph-core" }
ropey = "1.6"
similar = "2"
portable-pty = "0.8"
vt100 = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ignore = "0.4"
regex = "1"
serde_json = "1"
winit = "0.30"
softbuffer = "0.4"
nvim-rs = { version = "0.9", features = ["use_tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time"] }
async-trait = "0.1"
ab_glyph = "0.2"
ttf-parser = "0.25"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arboard = "3"
rustybuzz = "0.20.1"

[build-dependencies]
embed-resource = "2.5"

[profile.release]
# executavel menor e um pouco mais rapido (o instalador baixa este arquivo)
strip = true
lto = "thin"
codegen-units = 4

[dev-dependencies]
tree-sitter = "0.27.1"
tree-sitter-lua = "0.5.0"

# vt100 0.15 subtrai sem cuidado ao rolar o histórico além da altura da tela (estoura em debug,
# funciona com a aritmética de release); só essa dependência perde a checagem
[profile.dev.package.vt100]
overflow-checks = false
