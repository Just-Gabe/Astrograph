# Config da UI em Rust do Astrograph.
#
# Ordem de busca (o primeiro que existir vence):
#   1. --config <arquivo> (linha de comando)
#   2. variavel de ambiente ASTROGRAPH_UI_CONFIG
#   3. ./astrograph-ui.toml (diretorio atual)
#   4. astrograph-ui.toml ao lado do executavel
#   5. %APPDATA%\astrograph\ui.toml
#
# Todos os campos sao opcionais; os valores abaixo sao os defaults.

[window]
width = 1280
height = 800
title = "Astrograph"
# Margem (pixels logicos) entre a borda da janela e o texto.
padding = 10
# A janela nunca passa do tamanho da tela; abre centralizada.

[font]
# Tamanho em pixels da EM (tamanho "nominal" da fonte).
size = 18.0
# Multiplicador de altura de linha (0.8 a 3.0). 1.2 da respiro ao texto.
line_height = 1.2
# Fonte por estilo: caminho absoluto ou nome de arquivo (procura em
# C:\Windows\Fonts e na pasta de fontes do usuario). Se omitido, usa
# JetBrainsMono Nerd Font Mono.
# regular = "JetBrainsMonoNerdFontMono-Regular.ttf"
# bold = "JetBrainsMonoNerdFontMono-Bold.ttf"
# italic = "JetBrainsMonoNerdFontMono-Italic.ttf"
# Fontes de fallback, tentadas por glifo quando a principal nao tem o
# caractere (emoji, simbolos, CJK). Ordem importa.
fallback = ["seguiemj.ttf", "seguisym.ttf", "malgun.ttf"]
# Ligaduras de programacao (->, =>, !=, ===, <=, ::) quando a fonte tem
# (JetBrains Mono tem; as variantes "NL" nao). O caractere sob o cursor
# aparece sempre separado.
ligatures = true

[cursor]
blink = true
# Piscar comeca so depois de uma pausa: digitando, o cursor fica aceso.
blink_ms = 530
# Deslize do cursor entre posicoes, em ms (0 desliga).
animation_ms = 80

[scroll]
# Rolagem suave por pixel: o texto desliza e desacelera, em vez de pular de
# linha em linha. Duracao em ms (0 desliga).
animation_ms = 160

[lsp]
# formata o arquivo com o servidor de linguagem antes de gravar (:w)
format_on_save = false
