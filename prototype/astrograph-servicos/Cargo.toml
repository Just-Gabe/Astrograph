[package]
name = "astrograph-servicos"
version = "0.1.0"
edition = "2021"
description = "Astrograph: servicos em Rust (projeto, git, build nativo e atualizacao transacional), usados pelo app e pelo editor do terminal"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
