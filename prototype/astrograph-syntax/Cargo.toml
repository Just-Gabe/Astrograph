[package]
name = "astrograph-syntax"
version = "0.1.0"
edition = "2021"
description = "Astrograph: tipo de arquivo e realce por tree-sitter em Rust, fora do processo do Neovim"
publish = false

[dependencies]
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
tree-sitter-comment = "0.3.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-printf = "0.5.1"
tree-sitter-python = "0.25.0"
tree-sitter-regex = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-vim = "0.4.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4

[build-dependencies]
cc = "1.8.0"
